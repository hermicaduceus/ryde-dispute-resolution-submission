<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryde case file</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">RYDE / TRUST &amp; SAFETY</p>
      <h1>Case file</h1>
      <p class="intro">Load a generated case_file.json to inspect the dispute record.</p>
    </header>

    <section class="loader-panel" aria-labelledby="loader-title">
      <h2 id="loader-title">Load a case file</h2>
      <label for="case-picker">Case file JSON</label>
      <input id="case-picker" type="file" accept=".json,application/json">
      <p id="load-status" role="status" aria-live="polite">No case file loaded.</p>
    </section>

    <section id="case-summary" hidden aria-labelledby="summary-title">
      <div class="section-heading">
        <p class="eyebrow">LOADED RECORD</p>
        <h2 id="summary-title">Case metadata</h2>
      </div>
      <p id="loaded-file" class="loaded-file"></p>
      <dl id="metadata-list" class="metadata-list"></dl>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
